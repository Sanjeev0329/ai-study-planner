name: prepwise
description: AI-powered personalized study planner
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  google_sign_in: ^6.2.1
  flutter_riverpod: ^2.4.10
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  fl_chart: ^0.66.2
  intl: ^0.19.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.2
  flutter_dotenv: ^6.0.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/aistudyicon.png"
  adaptive_icon_foreground: "assets/images/aistudyicon.png"
  adaptive_icon_background: "#0F172A"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/